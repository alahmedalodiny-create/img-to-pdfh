name: pdf_scanner_plus
description: A lightweight PDF scanner app with Unity Ads
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  pdf: ^3.10.8
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  open_file: ^3.5.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  unity_ads_plugin: ^0.3.21
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
